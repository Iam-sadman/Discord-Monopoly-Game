version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: block-party-postgres
    restart: always
    environment:
      POSTGRES_USER: blockparty
      POSTGRES_PASSWORD: blockpartypass
      POSTGRES_DB: blockparty_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./server/src/db/schema.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U blockparty -d blockparty_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: block-party-server
    restart: always
    environment:
      PORT: 3001
      DATABASE_URL: postgres://blockparty:blockpartypass@postgres:5432/blockparty_db
      JWT_SECRET: block-party-secret-key-prod-2026
      ALLOW_DEV_AUTH: "true"
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID:-}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET:-}
      DISCORD_REDIRECT_URI: ${DISCORD_REDIRECT_URI:-}
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
